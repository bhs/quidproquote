services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "src/server.ts"]
    environment:
      PORT: "8080"
      ADMIN_TOKEN: demo-admin-token
      FETCH_CONTACT_EMAIL: maintainer@example.org
      REFRESH_START_DELAY_SECONDS: "86400"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
