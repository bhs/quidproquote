{% extends "admin_base.html" %}
{% block title %}Add a priority{% endblock %}
{% block body %}
<h1>Add a priority</h1>
{% if errors %}<div class="errors"><b>Not saved.</b><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" action="{{ url_for('admin_priority_new') }}">
  <label for="donor_id">Donor</label>
  <select id="donor_id" name="donor_id">
    <option value="">Choose a donor</option>
    {% for d in donors %}<option value="{{ d['id'] }}" {{ 'selected' if (form.get('donor_id') or '')|string == d['id']|string else '' }}>{{ d['name'] }}</option>{% endfor %}
  </select>
  <p class="small">The donor is not listed? <a href="{{ url_for('admin_donor_new') }}">Add a donor</a>.</p>
  <label for="label">Short label (optional)</label>
  <input type="text" id="label" name="label" value="{{ form.get('label', '') }}">
  <label for="section">Heading the words sit under on the page (optional)</label>
  <input type="text" id="section" name="section" value="{{ form.get('section', '') }}">
  <label for="words">The donor's exact words (required)</label>
  <textarea id="words" name="words">{{ form.get('words', '') }}</textarea>
  <label for="source_type">Source type (required)</label>
  <input type="text" id="source_type" name="source_type" list="source-types" value="{{ form.get('source_type', '') }}">
  <datalist id="source-types">{% for s in suggestions %}<option value="{{ s }}">{% endfor %}</datalist>
  <label for="url">Source URL (required)</label>
  <input type="url" id="url" name="url" value="{{ form.get('url', '') }}">
  <label for="retrieved">Date retrieved (required)</label>
  <input type="date" id="retrieved" name="retrieved" value="{{ form.get('retrieved', '') }}">
  <label for="page_date">Date on the page (optional)</label>
  <input type="date" id="page_date" name="page_date" value="{{ form.get('page_date', '') }}">
  <label for="measures">Measures to look for, one per line (Prop H). Measures the words name are added for you.</label>
  <textarea id="measures" name="measures">{{ form.get('measures', '') }}</textarea>
  <label for="phrases">Distinctive phrases to look for, one per line. A trailing * matches any ending (foreclosure*).</label>
  <textarea id="phrases" name="phrases">{{ form.get('phrases', '') }}</textarea>
  <p><button type="submit">Save the priority</button></p>
</form>
{% endblock %}
