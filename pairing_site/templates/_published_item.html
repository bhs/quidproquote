<section class="qitem" id="queue-{{ row.id }}">
  <p><a href="/pairings/{{ row.slug }}">{{ row.card.title }}</a> &middot; published {{ row.published_at }}
    &middot; <a href="{{ row.recording_url }}">Meeting recording</a> at {{ row.first_stamp }}</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if row.status == 'approved' and not row.recording_checked %}
  <div class="published-decide">
    <form method="post" action="/review/{{ row.id }}/verify" hx-post="/review/{{ row.id }}/verify" hx-target="closest .qitem" hx-swap="outerHTML">
      <label><input type="checkbox" name="recording_checked" required>
        I played the <a href="{{ row.recording_url }}">recording</a> at {{ row.first_stamp }} and the words match.</label>
      <input type="text" name="note" placeholder="Note (optional)" maxlength="500">
      <button type="submit" class="approve">Mark verified</button>
    </form>
    <form method="post" action="/review/{{ row.id }}/reject" hx-post="/review/{{ row.id }}/reject" hx-target="closest .qitem" hx-swap="outerHTML">
      <input type="text" name="note" placeholder="Why unpublish (optional)" maxlength="500">
      <button type="submit" class="reject">Unpublish</button>
    </form>
  </div>
  {% endif %}
</section>
